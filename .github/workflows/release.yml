name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # GitHub Release を作るため
  id-token: write # npm の Trusted Publishing (OIDC) に必要

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: corepack enable

      # Trusted Publishing は npm 11.5.1 以上を要求する
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g "npm@^11.5.1"
          npm --version

      - run: yarn install --immutable

      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag ${tag} does not match package.json ${pkg}" >&2
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # --generate-notes は PR を並べるだけで、直接コミットしている間は中身が出ない。
          # CHANGELOG.md の該当する節をそのままリリースノートにする。
          awk -v v="## [${version}]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ] || ! grep -q "[^[:space:]]" release-notes.md; then
            echo "CHANGELOG.md has no entry for ${version}" >&2
            exit 1
          fi
          cat release-notes.md

      - run: yarn typecheck

      - run: yarn typecheck:test

      - run: yarn test:run

      # prepublishOnly が yarn build を走らせる。--provenance で来歴を署名する。
      # そのバージョンが既に registry にある場合はスキップする（0.2.0 は Trusted
      # Publisher を登録できない初回だったため手動で publish した）。
      - name: Publish to npm unless the version is already there
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version > /dev/null 2>&1; then
            echo "${name}@${version} is already published; skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
